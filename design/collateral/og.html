<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Crewwise social card</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:"Hanken Grotesk",Arial,sans-serif;color:#F5F7FC;
    background:radial-gradient(700px 420px at 92% -10%, rgba(30,91,216,.55), transparent 70%), radial-gradient(500px 360px at -5% 110%, rgba(30,91,216,.35), transparent 70%), #0E1A33}
  .c{position:relative;height:100%;box-sizing:border-box;padding:70px 90px;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;gap:16px}
  .top svg{width:56px;height:56px}
  .wm{font-size:46px;font-weight:600;letter-spacing:-.06em;line-height:1}
  h1{margin:46px 0 0;font-size:74px;line-height:1;letter-spacing:-.045em;font-weight:600;max-width:15ch}
  .sub{margin-top:22px;font-size:28px;color:#AEB9CF;letter-spacing:-.01em}
  .r{margin-top:auto;position:relative;height:54px}
  .r:before{content:"";position:absolute;left:0;right:0;top:12px;height:2px;background:#243559}
  .t{position:absolute;left:0;top:11px;height:4px;width:78%;background:#1E5BD8;border-radius:2px}
  .d{position:absolute;left:78%;top:3px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#6BD39A;box-shadow:0 0 0 7px rgba(107,211,154,.25)}
  .pill{position:absolute;right:0;top:-8px;background:#C94708;color:#FFFFFF;font-size:24px;font-weight:700;padding:10px 20px;border-radius:12px}
</style></head><body><div class="c">
<div class="top"><svg viewBox="0 0 44 44"><rect width="44" height="44" rx="10" fill="#1E5BD8"/><polyline points="8,16 14.5,31 22,10.5 29.5,31 36,16" fill="none" stroke="#FFFFFF" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="wm">crewwise</span></div>
<h1>Crewwise answers your phone while you're on the roof.</h1>
<p class="sub">AI front desk for roofing companies. It books the inspection for you.</p>
<div class="r"><div class="t"></div><div class="d"></div><span class="pill">Book a demo</span></div>
</div></body></html>
