<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Crewwise social card</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<style>
  /* Flat brand colours only (style.css tokens): ground #F8F9FD, ink #0F1B33, blue #1E5BD8, ok #2E8B57, orange #C94708 */
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#F8F9FD;color:#0F1B33;font-family:"Hanken Grotesk",Arial,sans-serif}
  .c{position:relative;box-sizing:border-box;height:100%;padding:72px 84px 0;display:flex;flex-direction:column}
  .logo{display:flex;align-items:center;gap:15px}
  .logo svg{width:56px;height:56px}
  .logo span{font-weight:650;font-size:41px;letter-spacing:-0.019em;line-height:1}
  h1{margin:54px 0 0;font-size:84px;line-height:1;letter-spacing:-.04em;font-weight:600;max-width:15ch}
  .band{position:absolute;left:0;right:0;bottom:0;height:118px;background:#0F1B33;display:flex;align-items:center;padding:0 84px;gap:26px}
  .line{flex:1;position:relative;height:4px;border-radius:2px;background:#1E5BD8}
  .line::after{content:"";position:absolute;right:-6px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;background:#2E8B57;box-shadow:0 0 0 6px #0F1B33}
  .tag{color:#F5F7FC;font-size:30px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
  .btn{background:#C94708;color:#FFFFFF;font-size:28px;font-weight:700;padding:16px 26px;border-radius:14px;white-space:nowrap}
</style></head><body><div class="c">
  <div class="logo"><svg viewBox="0 0 44 44"><rect width="44" height="44" rx="10" fill="#1E5BD8"/><polyline points="8,16 14.5,31 22,10.5 29.5,31 36,16" fill="none" stroke="#FFFFFF" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>crewwise</span></div>
  <h1>Crewwise answers your phone while you're on the roof.</h1>
  <div class="band"><span class="tag">AI front desk for roofers</span><span class="line"></span><span class="btn">Book a demo</span></div>
</div></body></html>
